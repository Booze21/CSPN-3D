    this._mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    this._p = 0;
    this._isTouch = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    this._reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    this._soundOn = false;
    this._fx = { scale: 1, emiss: 0, spin: 0 };
    this._colorIdx = 0;
    this._logoBusy = false;
    this._palette = [
      { c1: '#a6f2ff', c2: '#00b4ff', glow: 'rgba(0,180,255,' },
      { c1: '#d3b3ff', c2: '#7c4dff', glow: 'rgba(124,77,255,' },
      { c1: '#b6ffd6', c2: '#20d47e', glow: 'rgba(32,212,126,' },
      { c1: '#ffd0a6', c2: '#ff5f8d', glow: 'rgba(255,95,141,' },
      { c1: '#ffeeb0', c2: '#f4b23a', glow: 'rgba(244,178,58,' },
      { c1: '#e2f6ff', c2: '#8fc9ff', glow: 'rgba(143,201,255,' },
    ];

    if (this.props.showScanlines === false) { if (this._scan) this._scan.style.display='none'; if (this._scanLine) this._scanLine.style.display='none'; }
    this.splitFutureText();
    if (!this._isTouch) { this.setupCursor(); this.setupMagnetic(); }
    else if (this._cursorDot) { this._cursorDot.style.display='none'; this._cursorRing.style.display='none'; }

    this._onMove = (e) => { this._mouse.tx = (e.clientX/window.innerWidth)*2-1; this._mouse.ty = (e.clientY/window.innerHeight)*2-1; };
    window.addEventListener('mousemove', this._onMove);
    this._entered = false;
    this._onScroll = () => { if (!this._entered && (window.scrollY||0) > 30 && this._enter && this._enter.style.visibility !== 'hidden') this.enterExperience(); };
    window.addEventListener('scroll', this._onScroll, { passive: true });
    this._onResize = () => { if (this._threeResize) this._threeResize(); };
    window.addEventListener('resize', this._onResize);

    this.setupNav();
    this.setupLogo();
    this.setupBackground();
    this.setupStars();
    this.runLoader();
    this.waitForThree(() => this.initWorld());
  }

  componentWillUnmount() {
    window.removeEventListener('mousemove', this._onMove);
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
    (this._raf||[]).forEach(id => cancelAnimationFrame(id));
    clearTimeout(this._starTimer);
    if (this._audioCtx) { try { this._audioCtx.close(); } catch(e){} }
  }

  waitForThree(cb) { let n=0; const c=()=>{ if(window.THREE) return cb(); if(n++>140) return; setTimeout(c,60); }; c(); }

  splitFutureText() {
    const el = this._futureText; if (!el) return;
    const txt = el.textContent; el.textContent = '';
    this._futureChars = [];
    for (const ch of txt) {
      const s = document.createElement('span');
      s.textContent = ch;
      s.style.display = 'inline-block';
      s.style.opacity = '0';
      s.style.transform = 'translateY(30px)';
      s.style.transition = 'opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1)';
      if (ch === ' ') s.style.width = '0.28em';
      el.appendChild(s);
      this._futureChars.push(s);
    }
  }

  // ---------- LOADER + ENTER ----------
  runLoader() {
    let dots = 0;
    this._dotTimer = setInterval(() => { dots=(dots+1)%4; if(this._loaderDots) this._loaderDots.textContent='.'.repeat(dots); }, 350);
    const stages = ['BOOTING CORE','LOADING GEOMETRY','SPAWNING PARTICLES','CALIBRATING CAMERA','SYSTEM READY'];
    let pct = 0;
    const tick = () => {
      pct += Math.random()*7 + 2.5;
      if (pct > 100) pct = 100;
      const p = Math.floor(pct);
      if (this._loaderBar) this._loaderBar.style.width = p+'%';
      if (this._loaderPct) this._loaderPct.textContent = p+'%';
      if (this._loaderStatus) this._loaderStatus.textContent = stages[Math.min(stages.length-1, Math.floor(pct/22))];
      if (pct < 100) { this._loadTimer = setTimeout(tick, 120 + Math.random()*90); }
      else { clearInterval(this._dotTimer); setTimeout(() => this.revealEnter(), 500); }
    };
    tick();
  }

  revealEnter() {
    if (this._loader) { this._loader.style.opacity='0'; this._loader.style.visibility='hidden'; }
    if (this._enter) { this._enter.style.opacity='1'; this._enter.style.visibility='visible'; }
    if (this._nav) this._nav.style.transition='opacity 1s ease .3s', this._nav.style.opacity='1';
    if (this._enterBtn) this._enterBtn.addEventListener('click', () => this.enterExperience(true));
  }

  enterExperience(nudge) {
    if (this._entered) return; this._entered = true;
    if (this._enter) { this._enter.style.opacity='0'; this._enter.style.visibility='hidden'; }
    if (this._hud) this._hud.style.opacity='1';
    this.startSound();
    if (!nudge) return;
    // gentle auto-scroll nudge so the user sees it's scrollable
    const target = window.innerHeight * 0.9;
    const t0 = performance.now();
    const from = window.scrollY;
    const anim = (t) => {
      const k = Math.min(1, (t-t0)/1100);
      const e = 1-Math.pow(1-k,3);
      window.scrollTo(0, from + (target-from)*e);
      if (k<1) requestAnimationFrame(anim);
    };
    requestAnimationFrame(anim);
  }

  // ---------- NAV / MENU / SOUND ----------
  setupNav() {
    const goto = (frac) => {
      const max = Math.max(1, (this._spacer ? this._spacer.offsetHeight : document.body.scrollHeight) - window.innerHeight);
      window.scrollTo({ top: frac*max, behavior: 'smooth' });
    };
    this._root.querySelectorAll('[data-goto]').forEach(a => {
      a.addEventListener('click', (e) => { e.preventDefault(); goto(parseFloat(a.getAttribute('data-goto'))); this.closeMenu(); });
    });
    if (this._burger) this._burger.addEventListener('click', () => this.openMenu());
    if (this._menuClose) this._menuClose.addEventListener('click', () => this.closeMenu());
    if (this._soundBtn) this._soundBtn.addEventListener('click', () => this.toggleSound());

    // nav glassiness on scroll
    const navApply = () => {
      const s = window.scrollY || 0;
      if (!this._nav) return;
      if (s > 40) { this._nav.style.background='rgba(6,10,16,0.6)'; this._nav.style.borderColor='rgba(0,180,255,0.16)'; this._nav.style.boxShadow='0 12px 40px rgba(0,0,0,0.5)'; this._nav.style.backdropFilter='blur(16px)'; this._nav.style.webkitBackdropFilter='blur(16px)'; }
      else { this._nav.style.background='rgba(6,10,16,0.2)'; this._nav.style.borderColor='rgba(120,180,255,0.06)'; this._nav.style.boxShadow='none'; this._nav.style.backdropFilter='blur(4px)'; this._nav.style.webkitBackdropFilter='blur(4px)'; }
    };
    window.addEventListener('scroll', navApply, { passive: true }); navApply();
  }

  openMenu() {
    if (!this._menu) return;
    this._menu.style.opacity='1'; this._menu.style.visibility='visible';
    this._menu.querySelectorAll('[data-mitem]').forEach((it,i) => {
      it.style.opacity='0'; it.style.transform='translateX(-24px)';
      it.style.transition='opacity .5s ease '+(i*0.06+0.1)+'s, transform .5s cubic-bezier(.16,1,.3,1) '+(i*0.06+0.1)+'s';
      requestAnimationFrame(() => { it.style.opacity='1'; it.style.transform='translateX(0)'; });
    });
  }
  closeMenu() { if (this._menu) { this._menu.style.opacity='0'; this._menu.style.visibility='hidden'; } }

  toggleSound() {
    if (!this._audioCtx) this.startSound(); else this.setSound(!this._soundOn);
  }
  startSound() {
    if (this._audioCtx) { this.setSound(true); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ctx = new AC(); this._audioCtx = ctx;
      const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
      const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; lp.connect(master);
      const freqs = [55, 82.4, 110, 164.8];
      freqs.forEach((f,i) => {
        const o = ctx.createOscillator(); o.type = i%2?'sine':'triangle'; o.frequency.value=f;
        const g = ctx.createGain(); g.gain.value = 0.16/(i+1);
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + i*0.03;
        const lg = ctx.createGain(); lg.gain.value = 0.06; lfo.connect(lg); lg.connect(g.gain);
        o.connect(g); g.connect(lp); o.start(); lfo.start();
      });
      this._audioMaster = master;
      this.setSound(true);
    } catch(e){}
  }
  setSound(on) {
    this._soundOn = on;
    if (this._audioMaster && this._audioCtx) {
      const t = this._audioCtx.currentTime;
      this._audioMaster.gain.cancelScheduledValues(t);
      this._audioMaster.gain.linearRampToValueAtTime(on?0.5:0, t+0.6);
      if (on && this._audioCtx.state==='suspended') this._audioCtx.resume();
    }
    if (this._soundIcon) { this._soundIcon.style.background = on?'#00B4FF':'#3a5566'; this._soundIcon.style.boxShadow = on?'0 0 8px #00B4FF':'none'; }
    if (this._soundLabel) this._soundLabel.textContent = on?'SOUND ON':'SOUND OFF';
  }

  // ---------- CURSOR / MAGNETIC ----------
  setupCursor() {
    const dot=this._cursorDot, ring=this._cursorRing; let rx=0, ry=0;
    this._cursorTarget = { x: window.innerWidth/2, y: window.innerHeight/2 };
    window.addEventListener('mousemove', (e) => { dot.style.left=e.clientX+'px'; dot.style.top=e.clientY+'px'; this._cursorTarget={x:e.clientX,y:e.clientY}; });
    const loop = () => { rx+=(this._cursorTarget.x-rx)*0.18; ry+=(this._cursorTarget.y-ry)*0.18; ring.style.left=rx+'px'; ring.style.top=ry+'px'; this._raf.push(requestAnimationFrame(loop)); };
    loop();
    this._root.addEventListener('mouseover', (e) => {
      const t=e.target.closest('[data-cursor]'); if(!t) return; const k=t.getAttribute('data-cursor');
      if(k==='button'){ring.style.width='60px';ring.style.height='60px';ring.style.background='rgba(0,180,255,0.12)';ring.style.borderColor='rgba(0,180,255,0.85)';}
      else{ring.style.width='52px';ring.style.height='52px';}
    });
    this._root.addEventListener('mouseout', (e) => { if(e.target.closest('[data-cursor]')){ring.style.width='38px';ring.style.height='38px';ring.style.background='transparent';ring.style.borderColor='rgba(0,180,255,0.55)';} });
  }
  setupMagnetic() {
    this._root.querySelectorAll('[data-magnetic]').forEach(el => {
      el.style.transition='transform .25s cubic-bezier(.16,1,.3,1), box-shadow .3s ease';
      el.addEventListener('mousemove', (e) => { const r=el.getBoundingClientRect(); const mx=e.clientX-(r.left+r.width/2); const my=e.clientY-(r.top+r.height/2); el.style.transform='translate('+mx*0.3+'px,'+my*0.45+'px) scale(1.05)'; if(el.hasAttribute('data-glow')) el.style.boxShadow='0 14px 54px rgba(0,180,255,0.6)'; });
      el.addEventListener('mouseleave', () => { el.style.transform='translate(0,0) scale(1)'; if(el.hasAttribute('data-glow')) el.style.boxShadow=''; });
    });
  }

  // ---------- CINEMATIC LOGO + BACKGROUND ----------
  setupLogo() {
    this.applyLogoColor(this._colorIdx || 0);
    if (this._reduced && this._logoInner) this._logoInner.style.animation = 'none';
  }

  applyLogoColor(idx) {
    const c = (this._palette || [])[idx]; if (!c) return;
    this._colorIdx = idx;
    const logo = this._logoMain, glow = this._logoGlow;
    if (logo) {
      logo.style.backgroundImage = 'linear-gradient(120deg, #ffffff 0%, ' + c.c1 + ' 40%, ' + c.c2 + ' 74%, #ffffff 100%)';
      logo.style.backgroundSize = '220% 100%';
      logo.style.webkitBackgroundClip = 'text';
      logo.style.backgroundClip = 'text';
      logo.style.webkitTextFillColor = 'transparent';
      logo.style.color = 'transparent';
      logo.style.animation = this._reduced ? 'none' : 'cspnSheen 8s linear infinite';
      logo.style.filter = 'drop-shadow(0 6px 20px rgba(0,0,0,0.45)) drop-shadow(0 0 26px ' + c.glow + '0.6)) drop-shadow(0 0 66px ' + c.glow + '0.34))';
    }
    if (glow) glow.style.color = c.c2;
  }

  flyLogo(nextIdx) {
    const gsap = window.gsap, outer = this._logoOuter, inner = this._logoInner;
    if (!outer || !gsap) { this.applyLogoColor(nextIdx); return; }
    this._logoBusy = true;
    if (inner) inner.style.animationPlayState = 'paused';
    const dir = Math.random() < 0.5 ? -1 : 1;
    const dist = window.innerWidth * (0.28 + Math.random() * 0.12) * dir;
    const tl = gsap.timeline({ onComplete: () => { this._logoBusy = false; if (inner) inner.style.animationPlayState = 'running'; } });
    tl.to(outer, { scale: 1.14, duration: 0.34, ease: 'power2.out' }, 0)
      .to(outer, { filter: 'brightness(2.1)', duration: 0.30, ease: 'power2.out' }, 0)
      .to(outer, { filter: 'brightness(1)', duration: 0.55, ease: 'power2.in' }, 0.36)
      .to(outer, { x: dist, y: -window.innerHeight * 0.05, scale: 0.42, opacity: 0, duration: 0.9, ease: 'power3.in' }, 0.36)
      .add(() => this.applyLogoColor(nextIdx))
      .set(outer, { x: 0, y: 0, scale: 0.7, filter: 'brightness(1)' })
      .to(outer, { opacity: 1, scale: 1, duration: 0.72, ease: 'power2.out' });
  }

  triggerGlobe() {
    if (this._logoBusy) return;
    const nextIdx = ((this._colorIdx || 0) + 1) % this._palette.length;
    this.globeReaction(this._palette[nextIdx]);
    this.nextBackground();
    this.flyLogo(nextIdx);
  }

  globeReaction(c) {
    const g = this._globe, gsap = window.gsap; if (!g) return;
    const col = new g.T.Color(c.c2);
    if (gsap && this._fx) {
      gsap.killTweensOf(this._fx);
      gsap.fromTo(this._fx, { scale: 1 }, { scale: 1.2, duration: 0.28, ease: 'power2.out', yoyo: true, repeat: 1 });
      gsap.fromTo(this._fx, { emiss: 0 }, { emiss: 2.0, duration: 0.26, ease: 'power2.out', yoyo: true, repeat: 1 });
      this._fx.spin = 6; gsap.to(this._fx, { spin: 0, duration: 1.0, ease: 'power2.out' });
    }
    if (gsap) {
      gsap.to(g.wireMat.color, { r: col.r, g: col.g, b: col.b, duration: 1.0 });
      g.rings.forEach(r => gsap.to(r.material.color, { r: col.r, g: col.g, b: col.b, duration: 1.0 }));
      gsap.killTweensOf(g.pmat);
      gsap.fromTo(g.pmat, { size: g.pmat.size }, { size: g.pmat.size * 2.2, duration: 0.32, ease: 'power2.out', yoyo: true, repeat: 1 });
    }
    this.spawnWave(c);
  }

  spawnWave(c) {
    const g = this._globe, gsap = window.gsap; if (!g || !gsap) return;
    const T = g.T, col = new T.Color(c.c2);
    const geo = new T.RingGeometry(2.4, 2.62, 72);
    const mat = new T.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.85, side: T.DoubleSide, blending: T.AdditiveBlending, depthWrite: false });
    const ring = new T.Mesh(geo, mat);
    ring.position.copy(g.coreGroup.position);
    ring.lookAt(g.camera.position);
    g.scene.add(ring);
    gsap.to(ring.scale, { x: 5.5, y: 5.5, z: 5.5, duration: 1.15, ease: 'power2.out' });
    gsap.to(mat, { opacity: 0, duration: 1.15, ease: 'power2.out', onComplete: () => { g.scene.remove(ring); geo.dispose(); mat.dispose(); } });
  }

  setupBackground() {
    this._bgScenes = Array.from((this._root || document).querySelectorAll('.cspn-bg-scene'));
    this._bgIdx = 0;
    if (!this._reduced && this._motes) {
      const n = this._isTouch ? 8 : 16;
      for (let i = 0; i < n; i++) {
        const m = document.createElement('div');
        m.className = 'cspn-mote';
        const s = 2 + Math.random() * 5;
        m.style.width = s + 'px'; m.style.height = s + 'px';
        m.style.left = (Math.random() * 100) + '%';
        m.style.top = (60 + Math.random() * 45) + '%';
        m.style.opacity = '0';
        m.style.animation = 'cspnMote ' + (9 + Math.random() * 10) + 's linear ' + (Math.random() * 8) + 's infinite';
        this._motes.appendChild(m);
      }
    }
    if (this._reduced) this._bgScenes.forEach(s => s.style.animation = 'none');
  }

  nextBackground() {
    if (!this._bgScenes || !this._bgScenes.length) return;
    this._bgIdx = (this._bgIdx + 1) % this._bgScenes.length;
    this._bgScenes.forEach((s, i) => { s.style.opacity = (i === this._bgIdx) ? '1' : '0'; });
    if (this._bg) {
      this._bg.style.transition = 'filter 1.3s ease';
      this._bg.style.filter = 'blur(8px)';
      clearTimeout(this._bgBlurT);
      this._bgBlurT = setTimeout(() => { if (this._bg) this._bg.style.filter = 'blur(0px)'; }, 40);
    }
  }

  setupStars() {
    const layer = this._meteors; if (!layer) return;
    // static twinkling starfield (Rolls-Royce headliner)
    if (!this._reduced) {
      const ns = this._isTouch ? 60 : 130;
      for (let i = 0; i < ns; i++) {
        const s = document.createElement('div');
        const sz = 1 + Math.random() * 1.8;
        s.style.cssText = 'position:absolute; top:' + (Math.random()*100) + '%; left:' + (Math.random()*100) + '%; width:' + sz + 'px; height:' + sz + 'px; border-radius:50%; background:#dff0ff; opacity:' + (0.2 + Math.random()*0.5).toFixed(2) + '; animation: cspnTwinkle ' + (2 + Math.random()*4).toFixed(1) + 's ease-in-out ' + (Math.random()*4).toFixed(1) + 's infinite;';
        layer.appendChild(s);
      }
    }
    // occasional shooting stars firing at intervals in varied directions
    if (this._reduced) return;
    const spawn = () => {
      const s = document.createElement('div');
      const len = 80 + Math.random() * 130;
      const ang = Math.random() * Math.PI * 2;
      const deg = ang * 180 / Math.PI;
      s.style.cssText = 'position:absolute; left:' + (10 + Math.random()*80) + '%; top:' + (8 + Math.random()*72) + '%; width:' + len + 'px; height:2px; border-radius:2px; background:linear-gradient(90deg, rgba(200,235,255,0), rgba(212,240,255,0.95)); box-shadow:0 0 8px rgba(160,215,255,0.9); transform:rotate(' + deg + 'deg); opacity:0; pointer-events:none;';
      layer.appendChild(s);
      const dist = 240 + Math.random() * 280;
      const dur = 900 + Math.random() * 700;
      const anim = s.animate([
        { transform: 'rotate(' + deg + 'deg) translate(0,0)', opacity: 0 },
        { opacity: 1, offset: 0.14 },
        { opacity: 1, offset: 0.7 },
        { transform: 'rotate(' + deg + 'deg) translate(' + dist + 'px,0)', opacity: 0 }
      ], { duration: dur, easing: 'cubic-bezier(.2,.6,.2,1)' });
      anim.onfinish = () => s.remove();
    };
    const loop = () => { spawn(); this._starTimer = setTimeout(loop, 1600 + Math.random() * 2800); };
    this._starTimer = setTimeout(loop, 1200);
  }

  // ---------- 3D WORLD ----------
  initWorld() {
    const canvas = this._canvas; if (!canvas) return;
    const T = window.THREE;
    const accent = new T.Color(this.props.accentColor || '#00B4FF');
    const cyan = new T.Color('#22e0ff');
    const violet = new T.Color('#7C4DFF');
    const bg = 0x04060a;

    const renderer = new T.WebGLRenderer({ canvas, antialias: !this._isTouch, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, this._isTouch ? 1.25 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.setClearColor(0x000000, 0);
    const scene = new T.Scene();
    scene.fog = new T.Fog(bg, 10, 62);
    const camera = new T.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 400);

    const disposables = [];
    const reg = (g,m) => { if(g) disposables.push(g); if(m) disposables.push(m); };

    // ---- Layout (Z depth) ----
    const Z = { core: -6, worldStart: -30, worldEnd: -78, eco: [-88,-96,-104,-112], portal: -152, future: [-168,-182,-196] };
    const shape = this.props.objectShape || 'Icosahedron';

    // ---- SCENE 01: CORE ----
    const coreGroup = new T.Group(); coreGroup.position.z = Z.core; scene.add(coreGroup);
    let cgeo;
    if (shape==='Octahedron') cgeo = new T.OctahedronGeometry(2.2, 0);
    else if (shape==='Torus Knot') cgeo = new T.TorusKnotGeometry(1.5, 0.46, 150, 20);
    else cgeo = new T.IcosahedronGeometry(2.2, 1);
    const coreMat = new T.MeshStandardMaterial({ color: 0x061018, emissive: accent, emissiveIntensity: 0.5, metalness: 0.85, roughness: 0.2, flatShading: true });
    const coreMesh = new T.Mesh(cgeo, coreMat); coreGroup.add(coreMesh); reg(cgeo, coreMat);
    const wireMat = new T.LineBasicMaterial({ color: accent, transparent: true, opacity: 0.5 });
    const wire = new T.LineSegments(new T.WireframeGeometry(cgeo), wireMat); coreGroup.add(wire); reg(null, wireMat);
    // orbiting rings
    const rings = [];
    for (let i=0;i<3;i++){
      const rg = new T.TorusGeometry(3.1 + i*0.9, 0.02, 8, 120);
      const rm = new T.MeshBasicMaterial({ color: i===1?cyan:accent, transparent: true, opacity: 0.55, blending: T.AdditiveBlending });
      const r = new T.Mesh(rg, rm); r.rotation.x = Math.PI/2 + i*0.5; r.rotation.y = i*0.7; coreGroup.add(r); rings.push(r); reg(rg,rm);
    }
    // core vertex dots
    const cdotGeo = new T.BufferGeometry().setAttribute('position', cgeo.getAttribute('position').clone());
    const cdotMat = new T.PointsMaterial({ color: 0xbfe9ff, size: 0.08, transparent: true, opacity: 0.9 });
    coreGroup.add(new T.Points(cdotGeo, cdotMat)); reg(cdotGeo, cdotMat);
    // invisible larger hit target so the globe is easy to click
    const hitGeo = new T.SphereGeometry(3.2, 16, 16);
    const hitMat = new T.MeshBasicMaterial({ visible: false });
    const hitSphere = new T.Mesh(hitGeo, hitMat); coreGroup.add(hitSphere); reg(hitGeo, hitMat);

    // ---- SCENE 02: WORLD (structures) ----
    const worldGroup = new T.Group(); scene.add(worldGroup);
    const structMat = new T.MeshBasicMaterial({ color: accent, wireframe: true, transparent: true, opacity: 0.34 });
    reg(null, structMat);
    const nStruct = this._isTouch ? 12 : 22;
    for (let i=0;i<nStruct;i++){
      const t = i/nStruct;
      const z = Z.worldStart + t*(Z.worldEnd-Z.worldStart);
      const side = i%2? 1 : -1;
      const x = side*(6 + Math.random()*10);
      const h = 6 + Math.random()*22;
      const g = new T.BoxGeometry(1.4+Math.random()*2, h, 1.4+Math.random()*2);
      const m = new T.Mesh(g, structMat);
      m.position.set(x, -6 + h/2 + (Math.random()-0.5)*4, z + (Math.random()-0.5)*6);
      m.rotation.y = Math.random()*Math.PI;
      worldGroup.add(m); reg(g,null);
    }
    // a few floating polyhedra
    const floaters = [];
    for (let i=0;i<(this._isTouch?4:8);i++){
      const g = new T.OctahedronGeometry(0.7+Math.random()*1.1, 0);
      const m = new T.MeshBasicMaterial({ color: i%3?cyan:accent, wireframe: true, transparent: true, opacity: 0.5 });
      const f = new T.Mesh(g,m);
      f.position.set((Math.random()-0.5)*24, (Math.random()-0.2)*10, Z.worldStart + Math.random()*(Z.worldEnd-Z.worldStart));
      worldGroup.add(f); floaters.push(f); reg(g,m);
    }

    // ---- SCENE 03: ECOSYSTEM (4 hoverable cores) ----
    const ecoGroup = new T.Group(); scene.add(ecoGroup);
    const ecoGeoms = [
      new T.IcosahedronGeometry(1.5,0), new T.OctahedronGeometry(1.6,0),
      new T.TorusGeometry(1.3,0.4,10,60), new T.DodecahedronGeometry(1.5,0)
    ];
    const ecoObjs = [];
    Z.eco.forEach((z,i) => {
      const grp = new T.Group();
      const col = [accent, cyan, violet, accent][i];
      const mm = new T.MeshStandardMaterial({ color: 0x06121c, emissive: col, emissiveIntensity: 0.45, metalness: 0.8, roughness: 0.25, flatShading: true });
      const mesh = new T.Mesh(ecoGeoms[i], mm); grp.add(mesh);
      const wm = new T.LineBasicMaterial({ color: col, transparent: true, opacity: 0.55 });
      grp.add(new T.LineSegments(new T.WireframeGeometry(ecoGeoms[i]), wm));
      grp.position.set(i%2? 5.5 : -5.5, (i<2? 1.6 : -1.6), z);
      grp.userData = { base: grp.position.clone(), hover: 0, mesh, mat: mm, idx: i };
      ecoGroup.add(grp); ecoObjs.push(grp); reg(ecoGeoms[i], mm); reg(null, wm);
    });

    // ---- SCENE 04: PORTAL ----
    const portalGroup = new T.Group(); portalGroup.position.z = Z.portal; scene.add(portalGroup);
    const portalRings = [];
    for (let i=0;i<7;i++){
      const rad = 3.4 + i*0.55;
      const rg = new T.TorusGeometry(rad, 0.08 + (6-i)*0.01, 10, 140);
      const rm = new T.MeshBasicMaterial({ color: i%2?cyan:accent, transparent: true, opacity: 0.7 - i*0.05, blending: T.AdditiveBlending });
      const r = new T.Mesh(rg, rm); r.position.z = -i*1.4; portalGroup.add(r); portalRings.push(r); reg(rg,rm);
    }
    const discGeo = new T.CircleGeometry(3.2, 64);
    const discMat = new T.MeshBasicMaterial({ color: violet, transparent: true, opacity: 0.28, blending: T.AdditiveBlending, side: T.DoubleSide });
    const disc = new T.Mesh(discGeo, discMat); disc.position.z = -5; portalGroup.add(disc); reg(discGeo, discMat);

    // ---- SCENE 05: FUTURE (minimal geometry) ----
    const futureGroup = new T.Group(); scene.add(futureGroup);
    Z.future.forEach((z,i) => {
      const rg = new T.RingGeometry(6+i*3, 6.1+i*3, 90);
      const rm = new T.MeshBasicMaterial({ color: i%2?violet:cyan, transparent: true, opacity: 0.18, side: T.DoubleSide });
      const r = new T.Mesh(rg, rm); r.position.set((i-1)*4, 0, z); futureGroup.add(r); reg(rg,rm);
    });

    // ---- PARTICLE FIELD (spans world) ----
    const pc = this._isTouch ? 450 : 1400;
    const arr = new Float32Array(pc*3); const spd = new Float32Array(pc);
    for (let i=0;i<pc;i++){ arr[i*3]=(Math.random()-0.5)*70; arr[i*3+1]=(Math.random()-0.5)*44; arr[i*3+2]=8 - Math.random()*220; spd[i]=0.3+Math.random(); }
    const pg = new T.BufferGeometry(); pg.setAttribute('position', new T.BufferAttribute(arr,3));
    const pmat = new T.PointsMaterial({ color: cyan, size: 0.09, transparent: true, opacity: 0.6, blending: T.AdditiveBlending, depthWrite: false });
    const stars = new T.Points(pg, pmat); scene.add(stars); reg(pg, pmat);

    // ---- LIGHTS ----
    scene.add(new T.AmbientLight(0x18324a, 0.8));
    const key = new T.PointLight(accent, 3, 60); key.position.set(6,6,Z.core+6); scene.add(key);
    const fill = new T.PointLight(violet, 1.5, 60); fill.position.set(-6,-4,Z.core+3); scene.add(fill);
    const travel = new T.PointLight(cyan, 2.2, 40); scene.add(travel);

    // ---- Raycaster for ecosystem hover ----
    const ray = new T.Raycaster(); const ndc = new T.Vector2(); let hoverIdx = -1;
    const ecoLabels = Array.from(this._root.querySelectorAll('[data-eco-label]'));
    if (!this._isTouch) {
      canvas.addEventListener('mousemove', (e) => { ndc.x=(e.clientX/window.innerWidth)*2-1; ndc.y=-(e.clientY/window.innerHeight)*2+1; this._ndc=ndc.clone(); });
    }

    // ---- Globe (core) click ----
    this._globe = { T, scene, camera, coreGroup, coreMesh, coreMat, wireMat, rings, pmat, hitSphere };
    const clickRay = new T.Raycaster(); const clickNdc = new T.Vector2();
    const onGlobe = (e) => {
      if (!this._entered || this._p > 0.16) return;
      const pt = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
      clickNdc.x = (pt.clientX/window.innerWidth)*2-1; clickNdc.y = -(pt.clientY/window.innerHeight)*2+1;
      clickRay.setFromCamera(clickNdc, camera);
      if (clickRay.intersectObject(hitSphere, false).length) this.triggerGlobe();
    };
    canvas.addEventListener('click', onGlobe);

    // ---- helper: scene opacity band ----
    const band = (p, a, b, c, d) => {
      if (p<=a || p>=d) return 0;
      if (p<b) return (p-a)/(b-a);
      if (p<=c) return 1;
      return 1-(p-c)/(d-c);
    };
    const overlays = {};
    this._root.querySelectorAll('[data-scene]').forEach(el => overlays[el.getAttribute('data-scene')] = el);
    const setOv = (name, o, y) => { const el=overlays[name]; if(!el) return; el.style.opacity=o.toFixed(3); el.style.transform='translateY('+(y||0)+'px)'; };

    const clock = new T.Clock();
    let camZ = 6;
    const render = () => {
      if (document.hidden) { this._raf.push(requestAnimationFrame(render)); return; }
      const dt = Math.min(clock.getDelta(), 0.05);
      const et = clock.elapsedTime;
      // adaptive perf: downgrade once if sustained low FPS
      this._fps = this._fps || { t: 0, n: 0, done: false };
      this._fps.t += dt; this._fps.n++;
      if (!this._fps.done && this._fps.n >= 90) {
        if (this._fps.n / this._fps.t < 40) { renderer.setPixelRatio(1); pmat.size = 0.07; }
        this._fps.done = true;
      }
      // scroll progress
      const max = Math.max(1, (this._spacer? this._spacer.offsetHeight : document.body.scrollHeight) - window.innerHeight);
      const p = Math.min(1, Math.max(0, (window.scrollY||0)/max));
      this._p = p;

      // smooth mouse
      this._mouse.x += (this._mouse.tx - this._mouse.x)*0.05;
      this._mouse.y += (this._mouse.ty - this._mouse.y)*0.05;

      // parallax (background + logo move differently) + scroll dimming
      if (this._bg) this._bg.style.opacity = (1 - Math.min(0.6, this._p * 1.1)).toFixed(3);
      if (!this._isTouch) {
        if (this._bgParallax) this._bgParallax.style.transform = 'translate3d(' + (this._mouse.x*-18).toFixed(2) + 'px,' + (this._mouse.y*-13).toFixed(2) + 'px,0)';
        if (this._logoParallax && !this._logoBusy) this._logoParallax.style.transform = 'translate3d(' + (this._mouse.x*30).toFixed(2) + 'px,' + (this._mouse.y*22).toFixed(2) + 'px,0)';
        if (this._p < 0.16) canvas.style.cursor = 'pointer'; else if (this._p < 0.4) canvas.style.cursor = '';
      }

      // camera travels the Z corridor
      const targetZ = 6 + p*(-210);
      camZ += (targetZ - camZ)*0.08;
      camera.position.x += ((this._mouse.x*3) - camera.position.x)*0.05;
      camera.position.y += ((1 - this._mouse.y*2) - camera.position.y)*0.05;
      camera.position.z = camZ;
      // subtle roll near portal
      const portalP = band(p, 0.66, 0.74, 0.80, 0.90);
      camera.rotation.z += ((this._mouse.x*0.05) + portalP*Math.sin(et*0.6)*0.04 - camera.rotation.z)*0.05;
      camera.lookAt(this._mouse.x*2, 1 - this._mouse.y*1.2, camZ - 12);
      travel.position.set(camera.position.x, camera.position.y+2, camZ - 4);

      // CORE animation
      coreGroup.rotation.y += dt*(0.25 + (this._fx ? this._fx.spin : 0));
      coreGroup.rotation.x = this._mouse.y*0.2;
      rings.forEach((r,i) => { r.rotation.z += dt*(0.3+i*0.15)*(i%2?-1:1); r.rotation.x += dt*0.1; });
      const beat = 1 + Math.sin(et*1.4)*0.05;
      coreMesh.scale.setScalar(beat * (this._fx ? this._fx.scale : 1));
      coreMat.emissiveIntensity = 0.5 + Math.sin(et*1.4)*0.15 + (this._fx ? this._fx.emiss : 0);

      // WORLD floaters
      floaters.forEach((f,i) => { f.rotation.x+=dt*0.4; f.rotation.y+=dt*0.3; f.position.y += Math.sin(et*0.6+i)*0.004; });

      // ECOSYSTEM
      if (this._ndc && p>0.4 && p<0.72) {
        ray.setFromCamera(this._ndc, camera);
        const meshes = ecoObjs.map(o=>o.userData.mesh);
        const hits = ray.intersectObjects(meshes, false);
        hoverIdx = hits.length ? hits[0].object.parent.userData.idx : -1;
        canvas.style.cursor = hits.length ? 'none' : '';
      } else hoverIdx = -1;
      ecoObjs.forEach((o,i) => {
        const ud = o.userData;
        ud.hover += ((i===hoverIdx?1:0) - ud.hover)*0.12;
        o.rotation.y += dt*(0.4+i*0.1);
        o.rotation.x += dt*0.2;
        o.position.z = ud.base.z + ud.hover*4;
        o.position.y = ud.base.y + Math.sin(et*0.7+i)*0.4;
        o.userData.mat.emissiveIntensity = 0.45 + ud.hover*1.4;
        o.scale.setScalar(1 + ud.hover*0.25);
        if (ecoLabels[i]) {
          ecoLabels[i].style.borderColor = ud.hover>0.4? 'rgba(0,180,255,0.7)' : 'rgba(120,180,255,0.14)';
          ecoLabels[i].style.transform = 'translateY('+(-ud.hover*6)+'px)';
        }
      });

      // PORTAL
      portalRings.forEach((r,i) => { r.rotation.z += dt*(0.3+i*0.12)*(i%2?1:-1); });
      disc.material.opacity = 0.2 + portalP*0.3 + Math.sin(et*2)*0.05;
      portalGroup.rotation.z += dt*0.05;

      // FUTURE
      futureGroup.children.forEach((r,i)=> r.rotation.z += dt*0.08*(i%2?1:-1));

      // particles drift (move whole field, no per-vertex CPU rewrite)
      stars.position.z += dt*3.5; if (stars.position.z > 26) stars.position.z -= 26;
      stars.rotation.z += dt*0.008;
      pmat.opacity = 0.35 + 0.3*Math.abs(Math.sin(et*0.3));

      // ---- OVERLAY timeline ----
      setOv('hero',  band(p, -0.01, 0.0, 0.05, 0.12), (1-band(p,-0.01,0,0.05,0.12))*20);
      setOv('core',  band(p, 0.12, 0.17, 0.24, 0.30), 0);
      setOv('world', band(p, 0.30, 0.35, 0.40, 0.46), 0);
      setOv('eco',   band(p, 0.46, 0.51, 0.64, 0.70), 0);
      setOv('portal',band(p, 0.70, 0.74, 0.79, 0.83), 0);
      const futO = band(p, 0.85, 0.89, 0.93, 0.965);
      setOv('future', futO, 0);
      setOv('final', band(p, 0.965, 0.985, 1.01, 1.02), 0);

      // future char reveal
      if (this._futureChars) {
        const on = futO > 0.3;
        this._futureChars.forEach((s,i) => {
          const show = on && p > 0.865 + (i/this._futureChars.length)*0.02;
          s.style.opacity = show? '1':'0';
          s.style.transform = show? 'translateY(0)':'translateY(30px)';
        });
      }

      // scanline dims in future scene
      if (this._scan) this._scan.style.opacity = (0.5*(1-futO*0.7)).toFixed(2);

      // fog + bg tint shift toward violet in future
      const fut = band(p, 0.82, 0.9, 1, 1.01);
      scene.fog.color.lerpColors(new T.Color(bg), new T.Color(0x0a0616), fut*0.7);
      renderer.setClearColor(scene.fog.color, 0);

      // button sweep
      if (this._sweep) { const sp=(et*0.5)%2; this._sweep.style.left = (sp<1? (-60 + sp*220) : 160)+'%'; }

      // HUD progress
      if (this._prog) this._prog.style.height = (p*100).toFixed(1)+'%';
      if (this._progPct) this._progPct.textContent = String(Math.round(p*100)).padStart(2,'0');
      if (this._signal && (this._frame|0)%18===0) this._signal.textContent = (97 + Math.random()*2.4).toFixed(1);
      this._frame = (this._frame||0)+1;

      renderer.render(scene, camera);
      this._raf.push(requestAnimationFrame(render));
    };
    render();

    this._threeResize = () => {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
    };
  }
}
</script>
</body>
</html>
